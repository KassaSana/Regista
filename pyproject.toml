[project]
name = "regista"
version = "0.1.0"
description = "Evidence-backed soccer match insights from event data"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.103",
    "duckdb>=1.5.5",
]

[project.scripts]
regista = "regista.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.103",
    "hypothesis>=6.161.5",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
markers = [
    "contract: checks assumptions against locally downloaded provider data",
]
pythonpath = ["tests/support"]
testpaths = ["tests"]

[tool.pyright]
extraPaths = ["src", "tests/support"]
include = ["scripts", "src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
venv = ".venv"
venvPath = "."

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
