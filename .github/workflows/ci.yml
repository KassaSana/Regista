# Checks every push and pull request with synthetic data only.
# Contract tests skip here because provider data (data/) is never in the repository.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.11.32"
          enable-cache: true
      - name: Install Python from .python-version
        run: uv python install
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Pyright (strict)
        run: uv run pyright
      - name: Tests (contract tests skip without local provider data)
        run: uv run pytest -rs
